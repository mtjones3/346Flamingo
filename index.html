<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Montauk House</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f0eb;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .icon {
      width: 120px;
      height: 120px;
      background: #2c2c2c;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      font-size: 56px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .address {
      font-size: 1rem;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    p {
      font-size: 1.1rem;
      color: #555;
      max-width: 480px;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .badge {
      display: inline-block;
    }

    .badge img {
      height: 52px;
    }

    footer {
      margin-top: 60px;
      font-size: 0.8rem;
      color: #bbb;
    }
  </style>
</head>
<body>

  <div class="icon">🏠</div>

  <h1>Montauk House</h1>
  <div class="address">346 Flamingo Road · Montauk, NY</div>

  <p>
    Keep everyone on the same page. Manage schedules, share updates, 
    and coordinate your Montauk house — all in one place.
  </p>

  <a class="badge" href="#" title="Download on the App Store">
    <img src="https://developer.apple.com/app-store/marketing/guidelines/images/badge-download-on-the-app-store.svg" alt="Download on the App Store" />
  </a>

  <footer>
    &copy; 2026 Montauk House · <a href="mailto:support@346flamingo.com" style="color:#bbb;">support@346flamingo.com</a>
  </footer>

</body>
</html>
